name: Publish to RubyGems

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: false

    - name: Install dependencies
      run: |
        gem install bundler rubocop
        bundle install --jobs 4 --retry 3

    - name: Run tests
      run: |
        for f in test/*_test.rb; do
          echo "Running $f..."
          ruby -Ilib:test "$f"
        done
      env:
        RAILS_OTEL_CONTEXT_TEST: 'true'

    - name: Run RuboCop
      run: rubocop lib/ test/ --format progress

  publish:
    name: Publish gem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: false

    - name: Build gem
      run: gem build rails-otel-context.gemspec

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: rails-otel-context-*.gem
        generate_release_notes: true
