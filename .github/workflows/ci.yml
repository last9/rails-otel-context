name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rails 7.1 — Ruby 3.1, 3.2, 3.3
          - { ruby: '3.1', rails: '7.1', gemfile: gemfiles/rails_7.1.gemfile }
          - { ruby: '3.2', rails: '7.1', gemfile: gemfiles/rails_7.1.gemfile }
          - { ruby: '3.3', rails: '7.1', gemfile: gemfiles/rails_7.1.gemfile }
          # Rails 7.2 — Ruby 3.1, 3.2, 3.3
          - { ruby: '3.1', rails: '7.2', gemfile: gemfiles/rails_7.2.gemfile }
          - { ruby: '3.2', rails: '7.2', gemfile: gemfiles/rails_7.2.gemfile }
          - { ruby: '3.3', rails: '7.2', gemfile: gemfiles/rails_7.2.gemfile }
          # Rails 8.0 — Ruby 3.2+ (Rails 8.0 requires Ruby >= 3.2)
          - { ruby: '3.2', rails: '8.0', gemfile: gemfiles/rails_8.0.gemfile }
          - { ruby: '3.3', rails: '8.0', gemfile: gemfiles/rails_8.0.gemfile }
          # Rails 8.1 — Ruby 3.2+ (Rails 8.1 requires Ruby >= 3.2)
          - { ruby: '3.2', rails: '8.1', gemfile: gemfiles/rails_8.1.gemfile }
          - { ruby: '3.3', rails: '8.1', gemfile: gemfiles/rails_8.1.gemfile }

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: false

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install --jobs 4 --retry 3

    - name: Run tests
      run: |
        for f in test/*_test.rb; do
          echo "Running $f..."
          bundle exec ruby -Ilib:test "$f"
        done
      env:
        RAILS_OTEL_CONTEXT_TEST: 'true'

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: false

    - name: Install dependencies
      run: |
        gem install bundler rubocop
        bundle install --jobs 4 --retry 3

    - name: Run RuboCop
      run: rubocop lib/ test/ --format progress

  build:
    name: Build Gem
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: false

    - name: Install dependencies
      run: gem install bundler

    - name: Build gem
      run: gem build rails-otel-context.gemspec

    - name: List gem contents
      run: gem specification rails-otel-context-*.gem

    - name: Upload gem artifact
      uses: actions/upload-artifact@v4
      with:
        name: rails-otel-context-gem
        path: rails-otel-context-*.gem
        retention-days: 7

  allocation_guard:
    name: Allocation Budget
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby 3.3
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: false

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install --jobs 4 --retry 3

    - name: Check allocation budgets
      run: ruby bench/allocation_guard.rb
      env:
        RAILS_OTEL_CONTEXT_TEST: 'true'
